name: Repository quality
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run the documented host checks
        run: |
          bash tests/run_host_tests.sh
  firmware:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    container: espressif/idf:v5.3.2
    steps:
      - uses: actions/checkout@v4
      - name: Build ESP32-C6 firmware with the locked IDF version
        shell: bash
        run: |
          source "$IDF_PATH/export.sh"
          idf.py -B build/esp-idf set-target esp32c6
          idf.py -B build/esp-idf build
